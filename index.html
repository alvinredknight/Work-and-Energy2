<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Christmas Work Challenge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: bulb garland across the top, then one centered snow-white card on pine green. One question at a time, stepper and live score above. */
:root{
  --pine:#0A3B2C; --pine-2:#0F5A41; --pine-3:#1C7A59;
  --cran:#C41E3A; --cran-d:#9E1630;
  --gold:#F4B942; --gold-d:#C98A12;
  --snow:#FBFCF8; --frost:#E6F0EA; --ink:#12261E; --ink-2:#4A5F55;
  --ok:#0F7A4F; --ok-bg:#E3F4EA; --bad:#B3261E; --bad-bg:#FCE8EA;
  --font:'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--snow);font-family:var(--font);font-size:16px;line-height:1.5;
  background-color:#0A3B2C;
  background-image:radial-gradient(900px 420px at 88% -6%,rgba(196,30,58,.30),transparent 62%),radial-gradient(760px 480px at 0% 0%,rgba(244,185,66,.13),transparent 58%),linear-gradient(180deg,#0A3B2C 0%,#08301F 100%);
}
.lights{display:flex;justify-content:space-between;height:36px;overflow:hidden;padding:0 6px;position:relative}
.lights::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:rgba(255,255,255,.28)}
.lights i{display:block;flex:none;width:11px;height:17px;margin-top:8px;border-radius:50% 50% 50% 50%/55% 55% 45% 45%;position:relative}
.lights i.c0{background:#E0314B;box-shadow:0 0 12px 2px rgba(224,49,75,.7)}
.lights i.c1{background:#F4B942;box-shadow:0 0 12px 2px rgba(244,185,66,.7)}
.lights i.c2{background:#3BD38A;box-shadow:0 0 12px 2px rgba(59,211,138,.6)}
.lights i.c3{background:#FFF6D8;box-shadow:0 0 12px 2px rgba(255,246,216,.6)}
@media (prefers-reduced-motion:no-preference){
  .lights i{animation:tw 2.6s ease-in-out infinite}
  .lights i:nth-child(3n){animation-delay:.5s}.lights i:nth-child(3n+1){animation-delay:1.1s}.lights i:nth-child(5n){animation-delay:1.7s}
  @keyframes tw{0%,100%{opacity:1}50%{opacity:.55}}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .6s ease-out both}
}
.wrap{max-width:780px;margin:0 auto;padding-block:14px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.eyebrow{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{margin:0;font-size:clamp(22px,5vw,30px);line-height:1.15;font-weight:700;text-wrap:balance}
.chip{font:inherit;font-size:14px;font-weight:600;color:var(--snow);background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer}
.chip:hover{background:rgba(255,255,255,.18)}
.chip.dark{color:var(--ink);background:var(--frost);border-color:#B9CFC4}
.chip.dark:hover{background:#D5E6DD}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin-bottom:14px}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:rgba(251,252,248,.62);padding:4px 10px 4px 5px;border-radius:999px;border:1.5px solid rgba(255,255,255,.2)}
.steps .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.14);font-size:12px;font-weight:700}
.steps li.done{color:var(--snow);border-color:rgba(59,211,138,.6)}
.steps li.done .n{background:#3BD38A;color:var(--pine)}
.steps li.now{color:var(--pine);background:var(--gold);border-color:var(--gold)}
.steps li.now .n{background:var(--pine);color:var(--gold)}
.score{font-size:15px;font-weight:500;color:var(--snow);background:rgba(0,0,0,.22);border-radius:12px;padding:6px 14px;font-variant-numeric:tabular-nums}
.score b{font-size:22px;color:var(--gold);font-weight:700}
.card{background:var(--snow);color:var(--ink);border-radius:22px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.card h2{margin:0 0 10px;font-size:clamp(22px,4.6vw,28px);line-height:1.25;font-weight:600;text-wrap:balance}
.card p{margin:0 0 12px}
.lead{color:var(--ink-2);font-size:17px}
.rules{list-style:none;margin:16px 0 20px;padding:0;display:grid;gap:8px}
.rules li{display:flex;align-items:center;gap:12px;background:var(--frost);border-radius:12px;padding:10px 14px}
.rules .pt{flex:none;min-width:58px;text-align:center;font-weight:700;color:#fff;background:var(--cran);border-radius:999px;padding:2px 10px;font-size:14px}
.rules .pt.g{background:var(--pine-2)}
.rules span:last-child{min-width:0}
label.f,legend.f{display:block;font-weight:600;font-size:15px;margin:18px 0 6px;padding:0}
input[type=text]{font:inherit;font-size:18px;color:var(--ink);background:#fff;border:2px solid #B9CFC4;border-radius:12px;padding:12px 14px;width:100%;min-height:52px}
input[type=text]:focus{border-color:var(--pine-3);outline:3px solid rgba(244,185,66,.7);outline-offset:1px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.secs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sec{position:relative;display:block}
.sec input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.sec span{display:grid;place-items:center;min-height:52px;border-radius:12px;border:2px solid #B9CFC4;background:#fff;font-weight:600;font-size:17px;text-align:center;padding:6px}
.sec input:checked+span{background:var(--pine-2);border-color:var(--pine-2);color:#fff;box-shadow:0 0 0 3px rgba(244,185,66,.8)}
.sec input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.note{font-size:14px;color:var(--ink-2)}
.btn{font:inherit;font-size:17px;font-weight:600;border:0;border-radius:14px;padding:14px 22px;min-height:52px;cursor:pointer;color:#fff;background:var(--cran);box-shadow:0 3px 0 var(--cran-d)}
.btn:hover{background:#D3243F}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--cran-d)}
.btn.green{background:var(--pine-2);box-shadow:0 3px 0 #08402C}
.btn.green:hover{background:var(--pine-3)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid #B9CFC4;box-shadow:none}
.btn:disabled{background:#C9D2CD;color:#7B8A82;box-shadow:none;cursor:not-allowed}
.btn.big{font-size:19px;padding:16px 26px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cran)}
.dots{display:flex;gap:6px;margin-bottom:16px}
.dots i{flex:1;height:7px;border-radius:4px;background:#D5E1DA}
.dots i.cur{background:var(--gold)}
.dots i.ok{background:var(--ok)}
.dots i.no{background:var(--cran)}
.qtext{font-size:clamp(19px,4.2vw,23px);line-height:1.45;font-weight:500;margin:0 0 14px}
.hint{font-size:15px;color:var(--ink-2);background:var(--frost);border-radius:12px;padding:10px 14px}
.formula{display:inline-block;font-weight:700;font-size:clamp(20px,4.5vw,26px);color:#fff;background:var(--pine-2);border-radius:12px;padding:6px 16px;margin:0 0 14px;letter-spacing:.02em}
.dia{margin:0 0 14px;background:var(--frost);border-radius:16px;padding:8px}
.dia svg{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.yn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.yn .btn{min-height:64px;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.yn .btn.no{background:var(--pine-2);box-shadow:0 3px 0 #08402C}
.yn .btn.no:hover{background:var(--pine-3)}
.yn .btn.pick{outline:4px solid var(--gold);outline-offset:2px}
kbd{font:inherit;font-size:12px;font-weight:700;background:rgba(255,255,255,.25);border-radius:6px;padding:1px 7px}
.ansrow{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.ansrow .inwrap{flex:1 1 180px;min-width:0;position:relative}
.ansrow input{padding-right:52px}
.unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--ink-2)}
.err{color:var(--bad);font-weight:600;min-height:1.4em;margin:8px 0 0;font-size:15px}
.fb{border-radius:16px;padding:16px 18px;margin-top:16px;border:2px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{margin:0 0 6px;font-size:19px;font-weight:700}
.fb.ok h3{color:var(--ok)}
.fb.no h3{color:var(--bad)}
.fb p{margin:0 0 6px}
.sol{font-weight:600;background:#fff;border-radius:10px;padding:8px 12px;overflow-x:auto;font-variant-numeric:tabular-nums}
.next{margin-top:16px;display:flex;justify-content:flex-end}
.done{text-align:center}
.done .badgeslot,.mastersl{display:flex;justify-content:center;margin:6px 0 4px}
.done .btn{margin-top:12px}
.bname{font-weight:700;font-size:20px;color:var(--cran);margin:0 0 4px}
.sum .sumc{display:block;width:100%;max-width:520px;height:auto;margin:6px auto 18px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.28)}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.master{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;background:linear-gradient(135deg,#FFF3CE,#FFE08A);border:2px solid var(--gold-d);border-radius:18px;padding:14px 18px;margin-bottom:18px;text-align:left}
.master p{margin:0;font-weight:600;color:#5C3B00}
.pad{margin-top:16px;background:rgba(0,0,0,.2);border-radius:16px;padding:12px 14px;color:var(--snow)}
.pad summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.pad canvas{display:block;width:100%;height:auto;margin:10px 0;border-radius:12px;background:#0F5A41;border:2px dashed rgba(255,255,255,.35);touch-action:none;cursor:crosshair}
.foot{margin-top:22px;text-align:center;font-size:13px;color:rgba(251,252,248,.7)}
@media (max-width:520px){
  .card{padding:20px 16px}
  .secs{grid-template-columns:1fr}
  .btn{width:100%}
  .yn .btn{font-size:17px}
  .next{justify-content:stretch}
}
</style>

<div class="lights" id="lights" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="46" height="52" viewBox="0 0 46 52" aria-hidden="true">
        <polygon points="23,2 27,12 38,12 29,19 33,30 23,23 13,30 17,19 8,12 19,12" fill="#F4B942"/>
        <polygon points="23,12 36,32 10,32" fill="#3BD38A"/>
        <polygon points="23,22 40,44 6,44" fill="#1C9F6B"/>
        <rect x="19" y="44" width="8" height="8" fill="#8B5A2B"/>
        <circle cx="19" cy="30" r="2.4" fill="#C41E3A"/><circle cx="27" cy="38" r="2.4" fill="#F4B942"/><circle cx="15" cy="40" r="2.4" fill="#FBFCF8"/>
      </svg>
      <div><p class="eyebrow">Grade 10 Physics</p><h1>Christmas Work Challenge</h1></div>
    </div>
    <button class="chip" id="btnSound" type="button" aria-pressed="true">Sound on</button>
  </header>
  <div class="bar">
    <ol class="steps" id="steps" aria-label="Progress"></ol>
    <div class="score" id="score" aria-live="polite"></div>
  </div>
  <main id="stage" tabindex="-1"></main>
  <details class="pad" id="padBox" hidden>
    <summary>Scratchpad: write your working with a mouse, pen or finger</summary>
    <canvas id="pad" width="900" height="320" aria-label="Scratchpad drawing area"></canvas>
    <button class="chip" id="padClear" type="button">Clear scratchpad</button>
  </details>
  <p class="foot">Work is done when a force moves an object. Merry Christmas and good luck.</p>
</div>

<script>
(function(){
'use strict';
var FONT='"Outfit","Segoe UI",system-ui,sans-serif';
var $=function(s,r){return (r||document).querySelector(s);};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var pick=function(a){return a[Math.floor(Math.random()*a.length)];};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function r2(n){return Math.round(n*100)/100;}
function num(n){return String(r2(n));}
function fx(n){return r2(n).toFixed(2);}

/* ---------- Sound (speaker output) ---------- */
var ac=null,soundOn=true;
function actx(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}}
  if(ac&&ac.state==='suspended'){try{ac.resume();}catch(e){}}
  return ac;
}
function tone(f,t0,d,type,g){
  if(!soundOn)return;var c=actx();if(!c)return;
  var o=c.createOscillator(),v=c.createGain(),t=c.currentTime+t0;
  o.type=type||'sine';o.frequency.value=f;
  v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g||0.12,t+0.02);v.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(v);v.connect(c.destination);o.start(t);o.stop(t+d+0.05);
}
var sfx={
  click:function(){tone(660,0,0.05,'triangle',0.05);},
  good:function(){[659.25,783.99,1046.5].forEach(function(f,i){tone(f,i*0.09,0.35,'sine',0.13);});tone(2093,0.22,0.3,'sine',0.03);},
  bad:function(){tone(220,0,0.18,'sawtooth',0.05);tone(174.6,0.16,0.32,'sawtooth',0.05);},
  badge:function(){[523.25,659.25,783.99,1046.5,1318.5,1568].forEach(function(f,i){tone(f,i*0.11,0.5,'sine',0.12);});},
  master:function(){[523.25,659.25,783.99,1046.5,783.99,1046.5,1318.5,1568,2093].forEach(function(f,i){tone(f,i*0.13,0.6,'sine',0.12);});}
};
function speak(text){
  if(!('speechSynthesis' in window))return;
  try{
    window.speechSynthesis.cancel();
    var t=text.replace(/(\d(?:\.\d+)?) N\b/g,'$1 newtons').replace(/(\d(?:\.\d+)?) J\b/g,'$1 joules').replace(/(\d(?:\.\d+)?) m\b/g,'$1 meters').replace(/°/g,' degrees').replace(/x-axis/g,'x axis');
    window.speechSynthesis.speak(new SpeechSynthesisUtterance(t));
  }catch(e){}
}

/* ---------- Content ---------- */
var P1_YES=[
 {t:'A student pushes a Christmas tree stand across the floor for 3 meters.',why:'The pushing force and the movement point the same way, so work is done.'},
 {t:'Santa lifts a heavy sack of gifts from the floor onto his sleigh.',why:'The lifting force is upward and the sack moves upward, so work is done.'},
 {t:'A child pulls a sled along the snow with a rope for 20 meters.',why:'The rope pulls the sled along its path, so work is done.'},
 {t:'An elf drags a box of toys across the workshop floor.',why:'The dragging force moves the box through a distance, so work is done.'},
 {t:'A man raises a Christmas star to the top of the tree.',why:'His upward force moves the star upward through a height, so work is done.'},
 {t:'A reindeer pulls a loaded sleigh forward across a snowy field.',why:'The pulling force and the displacement are in the same direction, so work is done.'}
];
var P1_NO=[
 {t:'A student pushes against a classroom wall with all her strength, but the wall does not move.',why:'There is a force but no displacement (d = 0), so no work is done.'},
 {t:'A boy walks along a level road at constant speed, carrying a bag of gifts. Is work done by the upward force that holds the bag?',why:'The holding force is upward but the bag moves horizontally. A force at 90° to the motion does no work.'},
 {t:'A girl holds a heavy box of ornaments still in the air for one minute.',why:'The box does not move, so there is no displacement and no work.'},
 {t:'A Christmas ball hangs motionless from a branch.',why:'Nothing moves, so no work is done.'},
 {t:'A choir member carries a songbook across the stage at constant height. Is work done by the upward force that holds the songbook?',why:'The holding force is upward and the motion is horizontal, so that force does no work.'},
 {t:'A father stands still holding a Christmas tree upright while the family decorates it.',why:'The tree does not move, so there is no displacement and no work.'}
];
var STEM2=[
 'An elf pushes a crate of toys across the workshop floor',
 'Santa drags his sack of gifts across the rooftop',
 'A reindeer pulls a loaded sleigh along a snowy trail',
 'A student pushes a cart of Christmas decorations down the hallway',
 'A volunteer slides a box of donated canned goods across the gym floor',
 'A choir member pulls a wagon of song sheets across the stage'
];
var STEM3=[
 'A child pulls a sled with a rope',
 'An elf pulls a toy wagon with a handle',
 'Santa pulls his gift sack across the floor with a strap',
 'A student pulls a cart of Christmas lights with a cord',
 'A reindeer pulls a sleigh with a harness line',
 'A volunteer drags a box of gifts with a rope'
];
var F2=[12,15,18,20,24,25,30,36,40,45,50,60,75,80,120,150,12.5,22.5,37.5];
var D2=[2,3,4,5,6,8,10,12,15,20,25,30];
var F3=[20,25,30,40,50,60,80,100,120,150];
var D3=[3,4,5,6,8,10,12,15,20];
var TH3=[20,25,30,35,40,45,50,55,60];
function trio(){var m=['W','F','d'];return shuffle(m.concat([pick(m),pick(m)]));}

function genP1(){
  var ny=Math.random()<0.5?2:3;
  var yes=shuffle(P1_YES).slice(0,ny).map(function(o){return {kind:'yn',text:o.t,why:o.why,work:true,answered:false};});
  var no=shuffle(P1_NO).slice(0,5-ny).map(function(o){return {kind:'yn',text:o.t,why:o.why,work:false,answered:false};});
  return shuffle(yes.concat(no));
}
function genP2(){
  var ms=trio(),st=shuffle(STEM2);
  return ms.map(function(m,i){
    var F=pick(F2),d=pick(D2),W=r2(F*d),s=st[i],text;
    if(m==='W')text=s+' with a constant force of '+F+' N over a distance of '+d+' m. How much work is done?';
    else if(m==='F')text=s+' over a distance of '+d+' m, and '+W+' J of work is done. What is the force applied?';
    else text=s+' with a constant force of '+F+' N, and '+W+' J of work is done. How far does it move?';
    return {kind:'num',missing:m,F:F,d:d,W:W,th:0,text:text,ans:m==='W'?W:(m==='F'?F:d),unit:m==='W'?'J':(m==='F'?'N':'m'),answered:false};
  });
}
function genP3(){
  var ms=trio(),st=shuffle(STEM3),ths=shuffle(TH3);
  return ms.map(function(m,i){
    var F=pick(F3),d=pick(D3),th=ths[i],c=Math.cos(th*Math.PI/180),W=r2(F*c*d),s=st[i],text,ans;
    var lead=s+' that makes an angle of '+th+'° with the x-axis. ';
    if(m==='W'){text=lead+'The force is '+F+' N and the object moves '+d+' m along the x-axis. How much work is done?';ans=W;}
    else if(m==='F'){text=lead+'The object moves '+d+' m along the x-axis and '+W+' J of work is done. What is the magnitude of the force?';ans=W/(c*d);}
    else{text=lead+'The force is '+F+' N and it does '+W+' J of work. How far does the object move along the x-axis?';ans=W/(F*c);}
    return {kind:'num',missing:m,F:F,d:d,W:W,th:th,c:c,text:text,ans:r2(ans),unit:m==='W'?'J':(m==='F'?'N':'m'),answered:false};
  });
}

/* ---------- State ---------- */
var S={stage:'intro',name:'',section:'',part:1,qi:0,items:{1:[],2:[],3:[]}};
var PTS={1:1,2:2,3:2},MAXP={1:5,2:10,3:10};
var PNAME={1:'Is work done?',2:'W = F × d',3:'W = F cos θ × d'};
var BT={p1:'Work Spotter',p2:'Formula Finder',p3:'Angle Ace',m:'Work Master'};
function partScore(p){return S.items[p].reduce(function(a,it){return a+(it.correct?PTS[p]:0);},0);}
function total(){return partScore(1)+partScore(2)+partScore(3);}
function partDone(p){return S.items[p].length>0&&S.items[p].every(function(it){return it.answered;});}
function curItem(){return S.items[S.part][S.qi];}

/* ---------- Badges (canvas) ---------- */
function star(c,cx,cy,R,rin){
  c.beginPath();
  for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,r=i%2?rin:R;c.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}
  c.closePath();
}
function drawBadge(c,cx,cy,r,kind,earned){
  c.save();
  if(!earned){

/* ---------- Actions ---------- */
function parseNum(s){
  s=String(s).trim().replace(/(\d),(?=\d{3}(\D|$))/g,'$1').replace(',','.');
  var m=s.match(/^[-+]?(\d+\.?\d*|\.\d+)/);
  return m?parseFloat(m[0]):NaN;
}
function mark(it,ok){
  it.answered=true;it.correct=ok;
  if(ok)sfx.good();else sfx.bad();
}
function act(a,b){
  if(a==='start'){
    if(S.name.trim().length<2||!S.section)return;
    actx();sfx.click();
    S.items={1:genP1(),2:genP2(),3:genP3()};S.part=1;S.qi=0;S.stage='q';render();
  }else if(a==='yn'){
    var it=curItem();if(it.answered)return;
    it.user=b.dataset.v==='1';mark(it,it.user===it.work);render();
  }else if(a==='next'){
    sfx.click();
    if(S.qi<S.items[S.part].length-1){S.qi++;render();}
    else{S.stage='done';sfx.badge();render();}
  }else if(a==='cont'){
    sfx.click();
    if(S.part<3){S.part++;S.qi=0;S.stage='q';}
    else{S.stage='summary';render();if(total()===25)sfx.master();return;}
    render();
  }else if(a==='speak'){
    speak(curItem().text);
  }else if(a==='download'){
    downloadPNG();
  }else if(a==='again'){
    sfx.click();S.stage='intro';S.items={1:[],2:[],3:[]};render();
  }
}

stage.addEventListener('click',function(e){

  if(!isFinite(v)){$('#err').textContent='Type a number first, for example 12.5';$('#ans').focus();return;}
  var tol=S.part===3?Math.max(0.011,Math.abs(it.ans)*0.01):0.011;

});
stage.addEventListener('input',function(e){

function rr(c,x,y,w,h,r){

  c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}
function drawSummary(cv){

  for(var i=0;i<70;i++){c.beginPath();c.arc(rnd()*W,rnd()*H,1+rnd()*3,0,Math.PI*2);c.fill();}
  /* garland */
  var cols=['#E0314B','#F4B942','#3BD38A','#FFF6D8'];
  c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=3;c.beginPath();
  for(var k=0;k<=40;k++){var t=k/40,x=2*(1-t)*t*540+t*t*1080,y=(1-t)*(1-t)*40+2*(1-t)*t*130+t*t*40;if(k)c.lineTo(x,y);else c.moveTo(x,y);}
  c.stroke();
  for(var b=0;b<=16;b++){
    var tt=b/16,bx=2*(1-tt)*tt*540+tt*tt*1080,by=(1-tt)*(1-tt)*40+2*(1-tt)*tt*130+tt*tt*40+14;
    c.save();c.shadowColor=cols[b%4];c.shadowBlur=18;c.fillStyle=cols[b%4];c.beginPath();c.ellipse(bx,by,9,13,0,0,Math.PI*2);c.fill();c.restore();
  }
  c.textAlign='center';c.textBaseline='alphabetic';
  c.fillStyle='#F4B942';c.font='600 30px '+FONT;
  if('letterSpacing' in c)c.letterSpacing='6px';
  c.fillText('CHRISTMAS WORK CHALLENGE',W/2,185);
  if('letterSpacing' in c)c.letterSpacing='0px';
  c.fillStyle='#FFFFFF';c.font='700 74px '+FONT;c.fillText('Activity Summary',W/2,262);
  /* card */
  c.save();c.shadowColor='rgba(0,0,0,.4)';c.shadowBlur=40;c.shadowOffsetY=14;c.fillStyle='#FBFCF8';rr(c,60,300,960,1160,30);c.fill();c.restore();

function downloadPNG(){
  var cv=$('#sumCanvas'),msg=$('#dlMsg');
  drawSummary(cv);
  cv.toBlob(function(blob){
    if(!blob){msg.textContent='The image could not be made. Press and hold the picture and choose Save image.';return;}
    var fname='Work-Summary_'+S.name.trim().replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')+'_Grade10-'+S.section+'.png';
    var viaFallback=function(){
      try{
        var url=URL.createObjectURL(blob),a=document.createElement('a');
        a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(url);},4000);
        msg.textContent='Download started: '+fname+'. If nothing happens, press and hold the picture and choose Save image.';
      }catch(e){msg.textContent='Press and hold the picture and choose Save image.';}
    };
    var go=function(dl){
      if(!dl){viaFallback();return;}
      dl.save({filename:fname,data:blob}).then(function(){
        msg.textContent='Saved as '+fname+'. You can upload this picture now.';sfx.good();
      },function(err){
        if(err&&err.code==='declined')msg.textContent='Download cancelled. Press the button again when you are ready.';
        else viaFallback();
      });
    };
    try{
      if(window.claude&&typeof window.claude.use==='function'){window.claude.use('downloads').then(go,function(){go(null);});}
      else go(null);
    }catch(e){go(null);}
  },'image/png');
}
